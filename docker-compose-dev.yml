services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: forex_timescaledb_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forex_pw}
      POSTGRES_DB: ${POSTGRES_DB:-forex_data}
    volumes:
      - timescale_dev_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forex} -d ${POSTGRES_DB:-forex_data}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forex_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"

  grafana:
    image: grafana/grafana:latest
    container_name: forex_grafana_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_dev_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro

volumes:
  timescale_dev_data:
  grafana_dev_data:
