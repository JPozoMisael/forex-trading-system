apiVersion: 1

datasources:
  - name: TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb:5432
    user: ${POSTGRES_USER:-forex}
    database: ${POSTGRES_DB:-forex_data}
    isDefault: true
    jsonData:
      sslmode: 'disable'
      postgresVersion: 1600
      timescaledb: true
    secureJsonData:
      password: ${POSTGRES_PASSWORD:-forex_pw}
