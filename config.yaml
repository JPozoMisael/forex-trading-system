# ==========================================================================
# Configuración del modelo, el backtest, la validación y el paper trading.
# Las claves y contraseñas NO van aquí: van en .env (ver .env.example).
#
# Regla: estos valores se fijan ANTES de mirar resultados fuera de muestra.
# Cambiarlos hasta que el backtest salga bien es sobreajustar (ver
# docs/PLAN_INTEGRACION_COLAB.md, observación 5).
# ==========================================================================

mercado:
  par: EUR_USD
  temporalidad: H1
  fuente: dukascopy
  anios_historia: 15            # Dukascopy: EUR_USD H1 desde 2012

# Costes de un broker minorista (no el spread institucional de Dukascopy)
costes:
  spread_pips: 1.0
  slippage_pips: 0.3            # por ejecución: entrada y salida
  comision_por_lote: 7.0        # USD por lote estándar, ida y vuelta

riesgo:
  capital_inicial: 10000
  riesgo_por_operacion_pct: 1.0
  perdida_diaria_max_pct: 5.0
  # SL y TP en múltiplos de ATR: los MISMOS para el target del modelo y la operación.
  atr_periodo: 14
  sl_atr: 2.0
  tp_atr: 3.0                   # TP/SL = 1.5, el mínimo que exige el risk-manager en vivo

modelo:
  horizonte_velas: 48           # el target mira si toca TP o SL dentro de N velas
  # Solo opera si P(TP antes que SL) >= umbral. Punto de equilibrio con TP/SL = 1.5
  # y costos de ~0.12 R por operación: p * 1.5 - (1 - p) - 0.12 = 0  ->  p ~ 0.45.
  # 0.50 exige margen sobre ese punto. Fijado antes de ver resultados del modelo.
  umbral_probabilidad: 0.50
  features: base                # base | extendido (contexto de temporalidades mayores)
  semilla: 42
  lightgbm:
    n_estimators: 300
    learning_rate: 0.03
    num_leaves: 15
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0

validacion:
  entrenamiento_inicial_anios: 3   # la primera ventana entrena con los primeros 3 años
  ventana_prueba_meses: 6          # luego prueba 6 meses, avanza 6 meses y reentrena (ventana creciente)
  n_permutaciones: 2000
  min_operaciones: 30              # menos operaciones fuera de muestra = veredicto INSUFICIENTE
  expectativa_minima_r: 0.05       # expectativa mínima por operación (en R) para hablar de ventaja
  # Desde esta fecha empieza la PRUEBA FINAL: no se usa para comparar variantes,
  # solo para evaluar una vez la elegida. Antes de esta fecha está el periodo de DESARROLLO.
  # (Es el mismo periodo con el que se evaluó el modelo v1, así v1 y v2 se comparan igual.)
  inicio_prueba_final: "2023-10-27"

# Variantes que se comparan en el periodo de DESARROLLO (registradas antes de correrlas).
# Cada una cambia solo lo que indica sobre la sección "modelo".
# Regla de selección, fijada de antemano: la de mayor expectativa (R) en desarrollo con
# >= 100 operaciones y expectativa > 0. Si ninguna la cumple, se mantiene v1 y se informa.
experimentos:
  v1_base: {}
  v2_extendido:
    features: extendido
  v3_extendido_regularizado:
    features: extendido
    lightgbm:
      n_estimators: 200
      learning_rate: 0.02
      num_leaves: 7
      min_child_samples: 500
      subsample: 0.7
      subsample_freq: 1
      colsample_bytree: 0.7
      reg_lambda: 5.0
  v4_regularizado_umbral_055:
    features: extendido
    umbral_probabilidad: 0.55
    lightgbm:
      n_estimators: 200
      learning_rate: 0.02
      num_leaves: 7
      min_child_samples: 500
      subsample: 0.7
      subsample_freq: 1
      colsample_bytree: 0.7
      reg_lambda: 5.0

paper_trading:
  carpeta_logs: logs/paper

# --------------------------------------------------------------------------
# Más instrumentos y temporalidades. PRE-REGISTRADO el 2026-10-28, antes de correr:
#   - Mismo modelo v1_base para todos, sin ajustar nada por instrumento (los
#     parámetros se eligieron en el desarrollo de EUR_USD H1).
#   - Costes por instrumento en shared/fx.py (INSTRUMENT_COSTS); el resto de
#     `costes` (comisión) es el mismo.
#   - Una sola pasada en la prueba final (desde validacion.inicio_prueba_final),
#     con backtesting/src/run_instrumentos.py.
#   - Regla para activarlo en PAPER TRADING (DRY_RUN): veredicto VENTAJA CON
#     EVIDENCIA o POSITIVO PERO NO CONCLUYENTE y retorno neto > 0, igual que
#     EUR_USD H1. Para dinero real: VENTAJA CON EVIDENCIA con p < 0.05 / número de
#     combinaciones probadas (corrección de Bonferroni: con muchas pruebas alguna
#     sale bien por azar).
#   - En vivo el sistema usa UNA temporalidad (CANDLE_GRANULARITY). Si gana una
#     temporalidad distinta de H1 se decide aparte.
multi_instrumento:
  instrumentos: [EUR_USD, GBP_USD, USD_JPY, AUD_USD, XAU_USD]
  temporalidades: [H1, M30, M15]

# --------------------------------------------------------------------------
# Swing trading (4 horas y diario). PRE-REGISTRADO el 2026-10-29, antes de correr:
#   - Mismo modelo v1_base, sin ajustar nada (horizonte 48 velas: ~8 días en H4,
#     ~2 meses en D; SL 2 ATR y TP 3 ATR de la temporalidad).
#   - Mismos costes por instrumento y además SWAP: las posiciones duran días, así
#     que se cobra un 3 % anual sobre el nocional por cada día abierta, en ambas
#     direcciones (aproximación conservadora de los swaps de XM). También se le
#     cobra a "comprar y mantener".
#   - Una sola pasada en la prueba final (desde validacion.inicio_prueba_final):
#     python backtesting/src/run_instrumentos.py --seccion swing
#   - Mismas reglas que multi_instrumento. Para dinero real, Bonferroni con TODAS
#     las combinaciones probadas hasta ahora: 15 anteriores + 10 nuevas = 25
#     (p < 0.002).
#   - Si gana alguna, activarla en vivo requiere un cambio aparte (hoy el sistema
#     opera una sola temporalidad, H1); se decide después de ver el resultado.
# Resultado del 2026-10-29 (reports/20261029_1419_swing.md): NINGUNA cumple. 9 de 10
# pierden; el oro en H4 queda en -0.4 % (+0.001 R). El sistema sigue solo en H1.
swing:
  instrumentos: [EUR_USD, GBP_USD, USD_JPY, AUD_USD, XAU_USD]
  temporalidades: [H4, D]
  costes:
    financiamiento_anual_pct: 3.0
  pruebas_previas: 15

# Instrumentos que opera el strategy-engine (cada uno con su modelo). Solo se
# añaden los que cumplan la regla de arriba.
# Resultado del 2026-10-28 (reports/20261028_1541_instrumentos.md): en H1 cumplen
# EUR_USD, USD_JPY y XAU_USD (POSITIVO PERO NO CONCLUYENTE; ninguno llega a la
# evidencia exigida para dinero real). GBP_USD pierde y AUD_USD queda en cero.
# M30/M15: cumplen EUR_USD/USD_JPY/AUD_USD M30 y USD_JPY M15, pero el sistema en
# vivo usa una sola temporalidad (H1); quedan como resultado aparte.
produccion:
  activos: [EUR_USD, USD_JPY, XAU_USD]
  # Lo que dio la prueba final, para comparar con el paper trading en el reporte
  referencia_backtest:
    EUR_USD: {operaciones_mes: 2.1, expectativa_r: 0.03, profit_factor: 1.04, retorno_pct: 1.8, buy_hold_pct: 5.3}
    USD_JPY: {operaciones_mes: 1.9, expectativa_r: 0.11, profit_factor: 1.17, retorno_pct: 7.2, buy_hold_pct: 3.3}
    XAU_USD: {operaciones_mes: 2.6, expectativa_r: 0.13, profit_factor: 1.17, retorno_pct: 7.2, buy_hold_pct: 103.4}
